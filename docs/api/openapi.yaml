openapi: 3.1.0
info:
  title: AChat API
  version: 0.1.0
  description: |
    Shared HTTP contract between the responsive web client and Fastify service.

    The phase-one message generation endpoint is intentionally non-streaming. It
    establishes a small, reviewable server-side OpenAI integration without exposing
    provider credentials. Streaming responses, cancellation and reconnect recovery
    remain required by the PRD and are deferred to a later contract revision.
servers:
  - url: http://localhost:3000
    description: Local development
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service availability
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/demo:
    get:
      operationId: getDemo
      summary: Verify that the web client can call the Fastify service
      parameters:
        - in: query
          name: code
          required: true
          description: Demo verification code. Use `achat-demo` for the learning example.
          schema:
            type: string
            minLength: 1
          example: achat-demo
      responses:
        '200':
          description: Frontend and backend connection is working
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/conversations:
    get:
      operationId: listConversations
      summary: List conversations ordered by most recently updated
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/conversations/{conversationId}/messages:
    post:
      operationId: createConversationMessage
      summary: Add a user message and generate an assistant reply
      description: |
        Phase-one, non-streaming generation endpoint. On success, the service persists
        the user message and generated assistant reply as one completed exchange, then
        returns both messages together. No message resource is created when the
        operation returns a 4xx or 5xx response.

        Provider API keys are server-side configuration and must never be accepted in
        this request or included in any response. Streaming, cancellation and retry
        semantics are intentionally outside this phase-one operation.
      parameters:
        - in: path
          name: conversationId
          required: true
          description: Conversation receiving the new message.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationMessageRequest'
      responses:
        '201':
          description: User message and generated assistant reply created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ConversationNotFound'
        '502':
          $ref: '#/components/responses/ModelProviderError'
        '503':
          $ref: '#/components/responses/ModelProviderUnavailable'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status:
          const: ok
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    DemoResponse:
      type: object
      additionalProperties: false
      required: [message, timestamp]
      properties:
        message:
          type: string
          example: 你好，今天你想做点什么有趣的事情？
        timestamp:
          type: string
          format: date-time
    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: User-authored plain text sent to the assistant.
          example: 请用通俗的语言解释 Node.js 事件循环。
    CreateConversationMessageResponse:
      type: object
      additionalProperties: false
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: '#/components/schemas/Message'
        assistantMessage:
          $ref: '#/components/schemas/Message'
    Message:
      type: object
      additionalProperties: false
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INVALID_REQUEST
              message: Request validation failed.
    ConversationNotFound:
      description: Conversation does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: CONVERSATION_NOT_FOUND
              message: Conversation not found.
    ModelProviderError:
      description: The model provider returned an invalid or unsuccessful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: MODEL_PROVIDER_ERROR
              message: The assistant could not generate a response.
    ModelProviderUnavailable:
      description: Model generation is temporarily unavailable or not configured
      headers:
        Retry-After:
          description: Optional delay in seconds before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: MODEL_PROVIDER_UNAVAILABLE
              message: The assistant is temporarily unavailable. Please try again later.
