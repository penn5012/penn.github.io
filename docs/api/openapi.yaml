openapi: 3.1.0
info:
  title: AChat API
  version: 0.1.0
  description: |
    Shared HTTP contract between the responsive web client and Fastify service.

    Message generation supports both an atomic JSON response and incremental SSE
    delivery. Provider credentials remain server-side. Closing the SSE connection
    cancels the active upstream request and retains that user turn as paused context,
    so a later "continue" request can resume the interrupted topic. Reconnect recovery
    remains a later contract revision.
servers:
  - url: http://localhost:3000
    description: Local development
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service availability
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/demo:
    get:
      operationId: getDemo
      summary: Verify that the web client can call the Fastify service
      parameters:
        - in: query
          name: code
          required: true
          description: Demo verification code. Use `achat-demo` for the learning example.
          schema:
            type: string
            minLength: 1
          example: achat-demo
      responses:
        '200':
          description: Frontend and backend connection is working
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/conversations:
    get:
      operationId: listConversations
      summary: List conversations ordered by most recently updated
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/conversations/{conversationId}/messages:
    post:
      operationId: createConversationMessage
      summary: Add a user message and generate an assistant reply
      description: |
        Phase-one, non-streaming generation endpoint. On success, the service persists
        the user message and generated assistant reply as one completed exchange, then
        returns both messages together. No message resource is created when the
        operation returns a 4xx or 5xx response.

        Provider API keys are server-side configuration and must never be accepted in
        this request or included in any response. The optional provider and model
        selection applies only to this generation request; it does not change a
        conversation-wide preference. Clients that need incremental output use the
        sibling `/messages/stream` operation.
      parameters:
        - in: path
          name: conversationId
          required: true
          description: Conversation receiving the new message.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationMessageRequest'
      responses:
        '201':
          description: User message and generated assistant reply created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationMessageResponse'
        '400':
          $ref: '#/components/responses/InvalidMessageRequest'
        '404':
          $ref: '#/components/responses/ConversationNotFound'
        '502':
          $ref: '#/components/responses/ModelProviderError'
        '503':
          $ref: '#/components/responses/ModelProviderUnavailable'
  /api/conversations/{conversationId}/messages/stream:
    post:
      operationId: streamConversationMessage
      summary: Stream an assistant reply with server-sent events
      description: |
        Starts an incremental model generation and returns a `text/event-stream`.
        Gemini uses the Interactions API and emits text from `step.delta` events.

        The stream uses three application-level event types:

        - `assistant.delta`: `data` is a JSON object matching `AssistantDeltaEvent`.
        - `message.completed`: `data` matches `CreateConversationMessageResponse`.
        - `error`: `data` matches `ErrorEnvelope` when generation fails after the
          HTTP 200 stream has started.

        A successful exchange is persisted atomically before the `message.completed`
        event. Closing the HTTP connection aborts the active provider request and
        stores the submitted user message plus any assistant text already delivered
        as paused conversation context. A provider failure represented by an `error`
        event does not persist its partial output.
      parameters:
        - in: path
          name: conversationId
          required: true
          description: Conversation receiving the new message.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationMessageRequest'
      responses:
        '200':
          description: Incremental assistant response
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-cache, no-transform
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: assistant.delta
                data: {"delta":"Node.js "}

                event: assistant.delta
                data: {"delta":"使用事件循环。"}

                event: message.completed
                data: {"userMessage":{"id":"00000000-0000-4000-8000-000000000001","conversationId":"00000000-0000-4000-8000-000000000000","role":"user","content":"解释事件循环","createdAt":"2026-08-21T00:00:00.000Z"},"assistantMessage":{"id":"00000000-0000-4000-8000-000000000002","conversationId":"00000000-0000-4000-8000-000000000000","role":"assistant","content":"Node.js 使用事件循环。","createdAt":"2026-08-21T00:00:00.000Z"}}

        '400':
          $ref: '#/components/responses/InvalidMessageRequest'
        '404':
          $ref: '#/components/responses/ConversationNotFound'
        '503':
          $ref: '#/components/responses/ModelProviderUnavailable'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status:
          const: ok
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    DemoResponse:
      type: object
      additionalProperties: false
      required: [message, timestamp]
      properties:
        message:
          type: string
          example: 你好，今天你想做点什么有趣的事情？
        timestamp:
          type: string
          format: date-time
    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: User-authored plain text sent to the assistant.
          example: 请用通俗的语言解释 Node.js 事件循环。
        provider:
          $ref: '#/components/schemas/ModelProviderName'
        model:
          type: string
          enum: [gpt-5.4-nano, deepseek-chat, gemini-3.5-flash-lite]
          description: |
            Server-approved model identifier for the selected provider. When omitted,
            the service uses `gpt-5.4-nano` for `openai` and `deepseek-chat` for
            `deepseek`, and `gemini-3.5-flash-lite` for `gemini`. A model that does not
            belong to the selected provider is
            rejected with `MODEL_SELECTION_UNSUPPORTED`.
          examples: [gpt-5.4-nano, deepseek-chat, gemini-3.5-flash-lite]
    ModelProviderName:
      type: string
      enum: [openai, deepseek, gemini]
      default: openai
      description: |
        Model provider used for this generation request. Defaults to `openai` when
        omitted. Provider credentials are selected from server-side configuration;
        clients cannot supply API keys or provider base URLs.
    CreateConversationMessageResponse:
      type: object
      additionalProperties: false
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: '#/components/schemas/Message'
        assistantMessage:
          $ref: '#/components/schemas/Message'
    AssistantDeltaEvent:
      type: object
      additionalProperties: false
      required: [delta]
      properties:
        delta:
          type: string
          minLength: 1
          description: Newly generated assistant text to append to the current response.
    Message:
      type: object
      additionalProperties: false
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INVALID_REQUEST
              message: Request validation failed.
    InvalidMessageRequest:
      description: Invalid message content or unsupported provider/model selection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidRequest:
              summary: Message request validation failed
              value:
                error:
                  code: INVALID_REQUEST
                  message: Request validation failed.
            unsupportedModelSelection:
              summary: Provider and model are not an approved pair
              value:
                error:
                  code: MODEL_SELECTION_UNSUPPORTED
                  message: The selected provider and model combination is not supported.
            unsupportedStreamingProvider:
              summary: Selected provider has no incremental streaming implementation
              value:
                error:
                  code: MODEL_STREAMING_UNSUPPORTED
                  message: The selected model provider does not support streaming.
    ConversationNotFound:
      description: Conversation does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: CONVERSATION_NOT_FOUND
              message: Conversation not found.
    ModelProviderError:
      description: The model provider returned an invalid or unsuccessful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: MODEL_PROVIDER_ERROR
              message: The assistant could not generate a response.
    ModelProviderUnavailable:
      description: Model generation is temporarily unavailable or not configured
      headers:
        Retry-After:
          description: Optional delay in seconds before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: MODEL_PROVIDER_UNAVAILABLE
              message: The assistant is temporarily unavailable. Please try again later.
